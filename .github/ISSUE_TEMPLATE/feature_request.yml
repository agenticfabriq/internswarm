name: Feature request
description: Something InternSwarm could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and what gets in the way, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
